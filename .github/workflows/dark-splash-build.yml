name: Build Super Productivity (dark splash)

# Builds the newest official Super Productivity release with a dark Android
# splash/window background and publishes the signed APK as a Release in THIS repo.
# Point Obtainium at this repo to get updates automatically.

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours; only builds when upstream has a new release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (e.g. v18.21.2). Empty = latest release.'
        required: false
        default: ''
      force:
        description: 'Rebuild even if this repo already has a release for the tag'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dark-splash-build
  cancel-in-progress: false

env:
  UPSTREAM: super-productivity/super-productivity
  DARK_COLOR: '#131314'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Pick tag and decide whether to build
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)"
          fi
          echo "Upstream tag: $tag"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::could not determine upstream tag"; exit 1
          fi
          build=true
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${FORCE:-false}" != "true" ]; then
              echo "Release $tag already exists here - nothing to do."
              build=false
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Checkout upstream at the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup android-sdk
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      # ---- THE PATCH: dark splash + dark window background (never committed) ----
      - name: Apply dark splash patch
        run: |
          set -euo pipefail
          f=android/app/src/main/res/values/colors.xml
          grep -n 'name="windowBackground"' "$f"
          sed -i -E "s|(<color name=\"windowBackground\">)#[0-9A-Fa-f]{6,8}(</color>)|\1${DARK_COLOR}\2|" "$f"
          grep -q "name=\"windowBackground\">${DARK_COLOR}<" "$f" \
            || { echo "::error::patch did not apply - upstream changed colors.xml"; exit 1; }
          grep -n 'name="windowBackground"' "$f"
          
      - name: Get my patch files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: my-patches

      - name: Apply splash start-page colour patch
        run: git apply my-patches/splash-start-page-accent.patch
        
      - name: Install npm packages
        run: npm i

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > keystore.jks

      - name: Build web app and sync to Android
        run: |
          npm run buildFrontend:prodWeb
          npm run sync:android

      - name: Build signed APK (F-Droid flavor, no Google Play bits)
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFdroidRelease

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/fdroid/release/*.apk)
          [ ${#apks[@]} -eq 1 ] || { echo "::error::expected exactly one APK, got ${#apks[@]}"; ls -R android/app/build/outputs/apk || true; exit 1; }
          out="super-productivity-dark-${TAG}.apk"
          cp "${apks[0]}" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          set -euo pipefail
          notes="Super Productivity ${TAG} with a dark Android splash (windowBackground ${DARK_COLOR}). Built from upstream tag ${TAG}: https://github.com/${UPSTREAM}/releases/tag/${TAG}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$FILE" --repo "${{ github.repository }}" --title "$TAG (dark splash)" --notes "$notes" --latest
          fi
